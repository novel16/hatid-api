name: Hatid API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: hatid-api-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: mbstring, pdo_sqlite, pdo_mysql, curl, xml, zip
          tools: composer:v2
          coverage: none

      - name: Test locked dependencies with isolated SQLite
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate --no-interaction
          php artisan test --compact
          for script in deploy/*.sh; do bash -n "$script"; done

      - name: Package the verified commit and production dependencies
        run: |
          release=$(mktemp -d)
          git archive "$GITHUB_SHA" | tar -x -C "$release"
          test ! -e "$release/.env"
          composer --working-dir="$release" install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
          tar -czf "$RUNNER_TEMP/release.tar.gz" -C "$release" .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hatid-api-release
          path: ${{ runner.temp }}/release.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && vars.HATID_DEPLOY_TARGET != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check that this run still matches main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main commit is available.'
          fi

      - if: steps.head.outputs.deploy == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hatid-api-release
          path: ${{ runner.temp }}

      - if: steps.head.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ fromJSON(vars.HATID_DEPLOY_TARGET).region }}
          role-to-assume: ${{ fromJSON(vars.HATID_DEPLOY_TARGET).role }}
          role-session-name: hatid-${{ github.run_id }}

      - name: Activate the release and verify public HTTPS
        if: steps.head.outputs.deploy == 'true'
        env:
          RELEASE_BUCKET: ${{ fromJSON(vars.HATID_DEPLOY_TARGET).bucket }}
          INSTANCE_ID: ${{ fromJSON(vars.HATID_DEPLOY_TARGET).instance }}
          API_ORIGIN: ${{ fromJSON(vars.HATID_DEPLOY_TARGET).origin }}
          AWS_PAGER: ""
        run: |
          artifact="$RUNNER_TEMP/release.tar.gz"
          read -r digest _ < <(sha256sum "$artifact")
          aws s3api put-object --bucket "$RELEASE_BUCKET" \
            --key "releases/$GITHUB_SHA-$digest.tar.gz" \
            --body "$artifact" --server-side-encryption AES256 >/dev/null
          parameters=$(jq -cn --arg commit "$GITHUB_SHA" --arg digest "$digest" \
            '{Commit: [$commit], Digest: [$digest]}')
          command=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name HatidApiRelease --parameters "$parameters" \
            --timeout-seconds 120 --query Command.CommandId --output text)

          for attempt in {1..120}; do
            if ! status=$(aws ssm get-command-invocation --command-id "$command" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>&1); then
              if [[ "$status" == *InvocationDoesNotExist* ]]; then
                status=Pending
              else
                printf '%s\n' "$status" >&2
                exit 1
              fi
            fi
            case "$status" in
              Success) break ;;
              Pending|InProgress|Delayed) sleep 5 ;;
              *) echo "Deployment ended with SSM status $status. Command $command"; exit 1 ;;
            esac
          done
          test "$status" = Success
          test "$(curl -fsS --max-time 15 -o /dev/null -w '%{http_code}' "$API_ORIGIN/up")" = 200
          printf 'Verified deployment of %s\n' "$GITHUB_SHA"
